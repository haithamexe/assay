# Tests on Linux, macOS and Windows, with the Node versions Assay supports.
#
# Runs on every push to main and every pull request, and can be started by hand (Actions tab, "Run workflow").
name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch replaces a run that is still going.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} · Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [22, 24]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      # Builds first, then runs every package's tests. The browser tests use the Chrome, Edge or Chromium the runner already has.
      - run: npm test
      - run: npm run check:public
