# Tests on Linux, macOS and Windows, with the Node versions Assay supports.
#
# For now this runs only when someone starts it (Actions tab, "Run workflow"). Once the repository is public, runs are free, and the
# "push" and "pull_request" lines below can be switched on so every change is tested on all three systems.
name: CI

on:
  workflow_dispatch:
  # push:
  #   branches: [main]
  # pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} · Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [22, 24]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      # Builds first, then runs every package's tests. The browser tests use the Chrome, Edge or Chromium the runner already has.
      - run: npm test
      - run: npm run check:public
