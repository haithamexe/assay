  --h-blue-fill: #7bb4fd; --h-blue-soft: #0b2648; --h-blue-text: #a9cefd; --h-blue-line: #6eadfe;
  --h-cyan-fill: #07c7dc; --h-cyan-soft: #012c32; --h-cyan-text: #42e2f7; --h-cyan-line: #0cc0d4;
  --h-lime-fill: #a4c025; --h-lime-soft: #232b00; --h-lime-text: #c0d772; --h-lime-line: #9eb919;
  --h-orange-fill: #fe9147; --h-orange-soft: #401a00; --h-orange-text: #feb98f; --h-orange-line: #fc8731;
  --h-pink-fill: #ff85a2; --h-pink-soft: #411521; --h-pink-text: #feb2c1; --h-pink-line: #ff799b;
  color-scheme: dark;
}

/* ---------------------------------------------------------------- base */
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  padding: var(--sheet-gap);
  background-color: var(--desk);
  background-image:
    linear-gradient(var(--desk-major) 1px, transparent 1px),
    linear-gradient(90deg, var(--desk-major) 1px, transparent 1px),
    linear-gradient(var(--desk-minor) 1px, transparent 1px),
    linear-gradient(90deg, var(--desk-minor) 1px, transparent 1px);
  background-size: 64px 64px, 64px 64px, 8px 8px, 8px 8px;
  background-attachment: fixed;
  color: var(--text);
  font: var(--t-base) / 1.5 var(--font);
  -webkit-font-smoothing: antialiased;
}
h1, h2, h3, h4, p { margin: 0; }
a { color: var(--accent); }
code, .mono { font-family: var(--mono); font-size: 0.92em; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
.visually-hidden { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.skip-link { position: absolute; left: var(--s2); top: -100px; z-index: 50; padding: var(--s2) var(--s3); background: var(--surface); border-radius: var(--r1); }
.skip-link:focus { top: var(--s2); }
.dim { color: var(--text-dim); }
.icon { width: 16px; height: 16px; flex: none; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.right { margin-left: auto; }

/* ---------------------------------------------------------------- layout */
.app {
  display: grid;
  grid-template-columns: var(--sidebar) minmax(0, 1fr);
  height: calc(100vh - 2 * var(--sheet-gap));
  min-height: 520px;
  background: var(--bg);
  border-radius: var(--r3);
  box-shadow: 0 0 0 1px var(--sheet-edge), var(--sheet-shadow);
  overflow: clip;
}
.sidebar, .main { min-height: 0; overflow-y: auto; overscroll-behavior: contain; scrollbar-width: thin; scrollbar-color: var(--border-strong) transparent; }
.sidebar { display: flex; flex-direction: column; gap: var(--s3); padding: var(--s4) var(--s3); background: var(--surface-2); border-right: 1px solid var(--border); }
.sidebar > * { flex: none; }
.brand { display: flex; align-items: center; gap: var(--s3); padding: 0 var(--s2) var(--s1); }
.brand-mark { width: 28px; height: 28px; image-rendering: pixelated; }
.brand-name { font: 400 var(--t-xl) / 1 var(--pixel); }
.project-switch { display: flex; flex-direction: column; gap: var(--s1); }
.project-switch-label, .nav-heading { padding: 0 var(--s3); color: var(--text-dim); font: 400 var(--t-label) / 1.5 var(--pixel); letter-spacing: 0.08em; text-transform: uppercase; }
.project-switch select { width: 100%; font-weight: 600; }
.palette-open { display: flex; align-items: center; justify-content: space-between; gap: var(--s2); min-height: var(--control); padding: 0 var(--s3); border: 1px solid var(--border-control); border-radius: var(--r1); background: var(--surface); color: var(--text-dim); cursor: pointer; text-align: left; }
.palette-open:hover { background: var(--surface-hover); }
kbd { padding: 1px 6px; border: 1px solid var(--border-strong); border-radius: 4px; background: var(--surface-2); font: 500 var(--t-xs) var(--mono); color: var(--text-dim); }
.nav { display: flex; flex-direction: column; gap: var(--s4); }
.nav-group { display: flex; flex-direction: column; gap: 1px; }
.nav-settings { padding-top: var(--s3); border-top: 1px solid var(--border); }
.nav a { position: relative; display: flex; align-items: center; gap: var(--s3); padding: var(--s2) var(--s3); border-radius: var(--r1); color: var(--text-dim); text-decoration: none; font-weight: 500; transition: background-color 0.12s, color 0.12s; }
.nav a:hover { background: var(--surface-hover); color: var(--text); }
.nav a[aria-current="page"] { background: var(--bg); color: var(--accent-hover); box-shadow: 0 0 0 1px var(--border); }
.nav a[aria-current="page"]::before { content: ""; position: absolute; left: -2px; top: 50%; width: 4px; height: 4px; margin-top: -2px; background: var(--marker); box-shadow: 0 0 0 1px var(--marker-ink); }
.nav .count { margin-left: auto; min-width: 20px; padding: 0 var(--s2); border-radius: 999px; background: var(--danger-soft); color: var(--danger); font-size: var(--t-xs); font-weight: 650; text-align: center; }
.sidebar-foot { margin-top: auto; display: flex; flex-direction: column; gap: var(--s2); }
.live-state { display: flex; align-items: center; gap: var(--s2); padding: 0 var(--s3); color: var(--text-dim); font-size: var(--t-xs); }
.live-state .dot { color: var(--ok); }
.main { min-width: 0; padding: var(--s6) var(--s6) var(--s8); outline: none; }
.page { max-width: 1240px; margin: 0 auto; display: flex; flex-direction: column; gap: var(--s5); }
.page-head { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: var(--s4); }
.page-title { font-size: var(--t-page); font-weight: 600; line-height: 1.25; letter-spacing: -0.02em; }
.page-sub { margin-top: var(--s1); color: var(--text-dim); }
.page-sub:empty { display: none; }
.toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: var(--s2); }
.section { display: flex; flex-direction: column; gap: var(--s3); }
.section-title { font-size: var(--t-section); font-weight: 600; line-height: 1.4; letter-spacing: -0.01em; }
.section-head { display: flex; align-items: center; justify-content: space-between; gap: var(--s3); flex-wrap: wrap; }
.label { color: var(--text-dim); font: 400 var(--t-label) / 1.5 var(--pixel); letter-spacing: 0.08em; text-transform: uppercase; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: currentColor; display: inline-block; }
@keyframes pulse { 50% { opacity: 0.35; } }
.dot-pulse { animation: pulse 1.4s ease-in-out infinite; }

/* ---------------------------------------------------------------- controls */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: var(--s2); min-height: var(--control); padding: 0 var(--s3); border: 1px solid var(--border-control); border-radius: var(--r1); background: var(--surface); color: var(--text); font-weight: 550; white-space: nowrap; cursor: pointer; text-decoration: none; transition: background-color 0.12s, border-color 0.12s, transform 0.06s; }
.btn:hover { background: var(--surface-2); }
.btn:active:not(:disabled) { transform: translateY(1px); }
.btn:disabled { opacity: 0.55; cursor: not-allowed; }
.btn-primary { background: var(--accent); border-color: var(--accent); color: var(--accent-text); }
.btn-primary:hover { background: var(--accent-hover); border-color: var(--accent-hover); }
.btn-second { background: var(--second-btn); border-color: var(--second-btn); color: var(--second-btn-text); }
.btn-second:hover { filter: brightness(1.08); background: var(--second-btn); }
.btn-ghost { border-color: transparent; background: transparent; }
.btn-ghost:hover { background: var(--surface-2); }
.btn-sm { min-height: 28px; padding: 0 var(--s2); font-size: var(--t-sm); }
.btn.is-ok { border-color: var(--ok); color: var(--ok); background: var(--ok-soft); }
.btn.is-bad { border-color: var(--danger); color: var(--danger); background: var(--danger-soft); }
@keyframes spin { to { transform: rotate(360deg); } }
.spinner { width: 14px; height: 14px; border: 2px solid currentColor; border-right-color: transparent; border-radius: 50%; animation: spin 0.7s linear infinite; }
@keyframes shake { 20%, 60% { transform: translateX(-4px); } 40%, 80% { transform: translateX(4px); } }
.shake { animation: shake 0.3s; }
.input, select { min-height: var(--control); padding: 0 var(--s3); border: 1px solid var(--border-control); border-radius: var(--r1); background: var(--surface); color: var(--text); }
.input::placeholder { color: var(--text-dim); }
.check { display: inline-flex; align-items: center; gap: var(--s2); cursor: pointer; }
.check input { width: 16px; height: 16px; accent-color: var(--accent); }
.segmented { display: inline-flex; padding: 2px; border: 1px solid var(--border-control); border-radius: var(--r1); background: var(--surface); max-width: 100%; flex-wrap: wrap; }
.segmented button { min-height: 28px; padding: 0 var(--s3); border: 0; border-radius: 4px; background: transparent; color: var(--text-dim); font-weight: 550; cursor: pointer; white-space: nowrap; }
.segmented button:hover { color: var(--text); }
.segmented button[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent-ink); }
.segmented button .n { margin-left: 6px; padding: 0 6px; border-radius: 999px; background: var(--surface-2); font-size: var(--t-xs); font-variant-numeric: tabular-nums; }
.segmented button[aria-pressed="true"] .n { background: var(--bg); }
.segmented button:disabled { opacity: 0.5; cursor: not-allowed; }

/* ---------------------------------------------------------------- surfaces */
.card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r2); box-shadow: var(--shadow); }
.card-pad { padding: var(--s4) var(--s5); }
.card-head { display: flex; align-items: center; gap: var(--s3); flex-wrap: wrap; padding: var(--s3) var(--s5); border-bottom: 1px solid var(--border); }
.card-title { font-weight: 650; }
.table-wrap { position: relative; overflow-x: auto; }
.table { width: 100%; border-collapse: collapse; }
.table th { padding: var(--s2) var(--s3); border-bottom: 1px solid var(--border); background: var(--surface-2); color: var(--text-dim); font: 400 var(--t-label) / 1.5 var(--pixel); letter-spacing: 0.08em; text-align: left; text-transform: uppercase; white-space: nowrap; }
.table td { padding: var(--s2) var(--s3); border-bottom: 1px solid var(--border); vertical-align: middle; }
.table tr:last-child td { border-bottom: 0; }
.table .num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.badge { display: inline-flex; align-items: center; gap: var(--s1); padding: 1px var(--s2); border-radius: 999px; background: var(--surface-2); color: var(--text-dim); font-size: var(--t-xs); font-weight: 600; white-space: nowrap; }
.badge-ok { background: var(--ok-soft); color: var(--ok); }
.badge-warn { background: var(--warn-soft); color: var(--warn-ink); }
.badge-danger { background: var(--danger-soft); color: var(--danger); }
.badge-accent { background: var(--accent-soft); color: var(--accent-ink); }
.badge-ai { background: var(--second-soft); color: var(--second-ink); }
/* Evidence tiers: one violet, three weights. Observed and inferred have their own hues so they are never confused. */
.tier-proven { background: var(--h-violet-fill); color: var(--h-violet-ink); }
.tier-corroborated { background: var(--h-violet-soft); color: var(--h-violet-text); box-shadow: inset 0 0 0 1px var(--h-violet-line); }
.tier-hint { background: transparent; color: var(--text-dim); box-shadow: inset 0 0 0 1px var(--border-control); border-radius: 6px; border-style: dashed; }
.tier-fixed { background: var(--ok-soft); color: var(--ok); }
.tier-intended { background: var(--surface-2); color: var(--text-dim); }
.tag { display: inline-block; padding: 0 6px; border-radius: 4px; font: 400 var(--t-label) / 1.6 var(--pixel); letter-spacing: 0.06em; text-transform: uppercase; vertical-align: 1px; }
.tag-observed { background: var(--h-cyan-soft); color: var(--h-cyan-text); }
.tag-inferred { background: var(--h-orange-soft); color: var(--h-orange-text); }
.chip-lang { display: inline-block; padding: 0 6px; border: 1px solid var(--border-strong); border-radius: 4px; background: var(--surface-2); color: var(--text-dim); font: 500 var(--t-xs) / 1.6 var(--mono); }
.callout { display: flex; gap: var(--s3); padding: var(--s3) var(--s4); border: 1px solid var(--border); border-radius: var(--r1); background: var(--surface-2); }
.callout-ai { border-color: var(--second); background: var(--second-soft); color: var(--text); }
.callout > .icon { margin-top: 3px; }
.inline-note { display: flex; align-items: center; gap: var(--s2); color: var(--text-dim); font-size: var(--t-sm); }
.zero { padding: var(--s5); text-align: center; color: var(--text-dim); }
pre.code, .rawblock { margin: 0; padding: var(--s3) var(--s4); border-radius: var(--r1); background: var(--log-bg); color: var(--log-text); font: var(--t-xs) / 1.6 var(--mono); overflow-x: auto; white-space: pre; }
.rawblock .k { color: var(--log-key); } .rawblock .bad { color: var(--log-err); } .rawblock .dimc { color: var(--log-dim); }

/* ---------------------------------------------------------------- timeline */
.riskstrip { display: flex; align-items: flex-end; gap: var(--s2); height: 84px; padding: var(--s3) var(--s4) 0; }
.riskstrip button { position: relative; flex: 1; display: flex; align-items: flex-end; justify-content: center; min-width: 0; height: 100%; padding: 0; border: 0; background: transparent; cursor: pointer; }
.riskstrip .bar { width: 100%; max-width: 44px; border-radius: 6px 6px 0 0; background: var(--border-strong); transition: background-color 0.12s; }
.riskstrip .bar.warn { background: var(--h-orange-fill); } .riskstrip .bar.danger { background: var(--danger); } .riskstrip .bar.ok { background: var(--h-lime-fill); }
.riskstrip button[aria-pressed="false"] .bar { opacity: 0.35; }
.riskstrip button[aria-pressed="true"] .bar { box-shadow: 0 0 0 2px var(--surface), 0 0 0 4px var(--accent); }
.riskaxis { display: flex; gap: var(--s2); padding: var(--s1) var(--s4) var(--s3); border-bottom: 1px solid var(--border); }
.riskaxis span { flex: 1; text-align: center; color: var(--text-dim); font: 400 10px/1.4 var(--mono); overflow: hidden; text-overflow: ellipsis; }
.tl td { padding-top: 6px; padding-bottom: 6px; }
.tl .lane { width: 28px; padding-right: 0; position: relative; }
.tl .lane::before { content: ""; position: absolute; left: 50%; top: 0; bottom: 0; width: 2px; margin-left: -1px; background: var(--lane-1); opacity: 0.5; }
.tl tr:first-child .lane::before { top: 50%; }
.tl tr:last-child .lane::before { bottom: 50%; }
.lane-dot { position: relative; display: block; width: 10px; height: 10px; margin: 0 auto; border-radius: 50%; background: var(--surface); border: 2px solid var(--lane-1); }
.lane-dot.fix { background: var(--ok); border-color: var(--ok); }
.crow.in-range td { background: var(--accent-soft); }
.crow.is-base td { color: var(--text-dim); }
.crow.bis-ok .lane-dot { background: var(--ok); border-color: var(--ok); }
.crow.bis-bad .lane-dot { background: var(--danger); border-color: var(--danger); }
.commit-btn { display: grid; grid-template-columns: 62px minmax(0, 1fr); column-gap: var(--s3); width: 100%; min-width: 230px; padding: var(--s1) var(--s2); border: 0; border-radius: var(--r1); background: transparent; text-align: left; cursor: pointer; }
.commit-btn:hover:not(:disabled) { background: var(--surface-hover); }
.commit-btn:disabled { cursor: default; }
.commit-btn .hash { color: var(--accent-ink); font-weight: 600; grid-row: span 2; align-self: center; }
.commit-btn .c-msg { font-weight: 550; overflow-wrap: anywhere; }
.commit-btn .c-meta { font-size: var(--t-xs); }
.cell { display: inline-flex; align-items: center; gap: 4px; padding: 1px var(--s2); border-radius: 6px; font-size: var(--t-xs); font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap; background: var(--surface-2); color: var(--text-dim); }
.cell.ok { background: var(--ok-soft); color: var(--ok); }
.cell.warn { background: var(--warn-soft); color: var(--warn-ink); }
.cell.danger { background: var(--danger-soft); color: var(--danger); }
.cell.none { background: transparent; font-weight: 400; }
.riskbar { display: flex; align-items: center; gap: var(--s2); min-width: 92px; }
.riskbar i { display: block; height: 6px; border-radius: 3px; background: var(--border-strong); flex: 1; position: relative; overflow: hidden; }
.riskbar i b { position: absolute; inset: 0 auto 0 0; border-radius: 3px; }
.riskbar .ok b { background: var(--h-lime-fill); } .riskbar .warn b { background: var(--h-orange-fill); } .riskbar .danger b { background: var(--danger); }
.riskbar span { font: 600 var(--t-xs) var(--mono); min-width: 22px; text-align: right; }
.bisect-log { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 2px; font: var(--t-xs) / 1.7 var(--mono); }
.bisect-log li { display: flex; gap: var(--s2); align-items: center; }

/* ---------------------------------------------------------------- case file */
.verdict { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: var(--s4) var(--s5); align-items: center; padding: var(--s5); border: 1px solid var(--border); border-left-width: 6px; border-radius: var(--r2); background: var(--surface); }
.verdict.danger { border-left-color: var(--danger); } .verdict.warn { border-left-color: var(--h-orange-line); } .verdict.ok { border-left-color: var(--ok); }
.verdict-icon { display: grid; place-items: center; width: 44px; height: 44px; border-radius: 12px; }
.verdict.danger .verdict-icon { background: var(--danger-soft); color: var(--danger); } .verdict.warn .verdict-icon { background: var(--warn-soft); color: var(--warn-ink); } .verdict.ok .verdict-icon { background: var(--ok-soft); color: var(--ok); }
.verdict-icon .icon { width: 24px; height: 24px; }
.verdict h2 { font-size: var(--t-xl); letter-spacing: -0.01em; }
.verdict .counts { margin-top: var(--s1); color: var(--text-dim); }
.verdict .counts b { color: var(--text); font-weight: 650; }
.verdict-foot { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: var(--s2) var(--s5); padding-top: var(--s3); border-top: 1px solid var(--border); color: var(--text-dim); font-size: var(--t-sm); }
.verdict-foot b { color: var(--text); font-weight: 600; }
.page > .segmented { align-self: flex-start; }
.facets { display: flex; flex-wrap: wrap; gap: var(--s2); align-items: center; }
.facets .btn .n { margin-left: 6px; padding: 0 6px; border-radius: 999px; background: var(--surface-2); font-size: var(--t-xs); font-variant-numeric: tabular-nums; }
.facets .btn[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent-ink); border-color: var(--accent); }
.split { display: grid; grid-template-columns: minmax(280px, 360px) minmax(0, 1fr); gap: var(--s4); align-items: start; }
.itemlist { display: flex; flex-direction: column; gap: var(--s2); }
.citem { display: grid; grid-template-columns: 26px minmax(0, 1fr); gap: var(--s3); width: 100%; padding: var(--s3); border: 1px solid var(--border); border-radius: var(--r1); background: var(--surface); text-align: left; cursor: pointer; }
.citem:hover { background: var(--surface-hover); }
.citem[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); box-shadow: 0 0 0 1px var(--accent); }
.citem .rank { display: grid; place-items: center; width: 26px; height: 26px; border-radius: 8px; background: var(--surface-2); font: 600 var(--t-xs) var(--mono); }
.citem .it-title { font-weight: 600; line-height: 1.35; }
.citem .it-meta { display: flex; flex-wrap: wrap; gap: var(--s1) var(--s2); align-items: center; margin-top: 6px; font-size: var(--t-xs); color: var(--text-dim); }
.citem.is-done { opacity: 0.6; }
.citem.is-done .it-title { text-decoration: line-through; text-decoration-thickness: 1px; }
.pending-note { padding: var(--s3) var(--s4); border: 1px dashed var(--border-control); border-radius: var(--r1); color: var(--text-dim); font-size: var(--t-sm); }
.detail-head { padding: var(--s4) var(--s5); display: flex; flex-direction: column; gap: var(--s3); }
.detail-head h3 { font-size: var(--t-lg); line-height: 1.35; }
.badges { display: flex; flex-wrap: wrap; gap: var(--s2); align-items: center; }
.meaning { display: flex; flex-direction: column; gap: var(--s2); }
.meaning p { display: flex; gap: var(--s2); align-items: baseline; }
.meaning p .tag { flex: none; min-width: 72px; text-align: center; }
.why { display: flex; flex-wrap: wrap; gap: var(--s1) var(--s2); align-items: center; color: var(--text-dim); font-size: var(--t-xs); }
.why .badge { background: var(--surface-2); }
.revstrip { display: flex; flex-wrap: wrap; gap: var(--s2); align-items: center; font-size: var(--t-sm); color: var(--text-dim); }
.revstrip .silent { opacity: 0.7; }
.detail-actions { display: flex; flex-wrap: wrap; gap: var(--s2); align-items: center; padding: var(--s3) var(--s5); border-top: 1px solid var(--border); background: var(--surface-2); border-radius: 0 0 var(--r2) var(--r2); }
.detail-tabs { padding: 0 var(--s5) var(--s3); }
.tabbody { padding: 0 var(--s5) var(--s5); display: flex; flex-direction: column; gap: var(--s3); }
.kv { display: grid; grid-template-columns: auto minmax(0, 1fr) minmax(0, 1fr); border: 1px solid var(--border); border-radius: var(--r1); overflow: hidden; }
.kv > div { padding: var(--s2) var(--s3); border-bottom: 1px solid var(--border); overflow-wrap: anywhere; }
.kv > div:nth-last-child(-n+3) { border-bottom: 0; }
.kv .h { background: var(--surface-2); color: var(--text-dim); font: 400 var(--t-label) / 1.5 var(--pixel); letter-spacing: 0.08em; text-transform: uppercase; }
.kv .rowl { color: var(--text-dim); font-weight: 600; }
.kv .bad { background: var(--danger-soft); color: var(--danger); font-weight: 600; }
.kv .good { background: var(--ok-soft); color: var(--ok); font-weight: 600; }

function analyze(root) {
  const rr = root.getBoundingClientRect(); const issues = [];
  const rel = r => ({ x: r.left - rr.left, y: r.top - rr.top, w: r.width, h: r.height });
  root.querySelectorAll('.item').forEach(item => {
    const b = item.querySelector('.price-badge'), t = item.querySelector('.thumb'); if (!b || !t) return;
    const br = b.getBoundingClientRect(), tr = t.getBoundingClientRect();
    const ox = Math.min(br.right, tr.right) - Math.max(br.left, tr.left), oy = Math.min(br.bottom, tr.bottom) - Math.max(br.top, tr.top);

  });

  if (btn && btn.scrollWidth > btn.clientWidth + 1) issues.push({ kind: 'clip', label: 'The order button’s label is cut off', detail: `label is ${btn.scrollWidth}px in a ${btn.clientWidth}px button`, r: rel(btn.getBoundingClientRect()) });

}
function pageMemory() {
  const tabs = `<div class="segmented" role="group" aria-label="Memory">${[['mistakes', 'Mistakes'], ['standards', 'Standards'], ['mine', 'Learn from history']].map(([k, l]) => `<button data-act="mtab" data-v="${k}" aria-pressed="${S.mtab === k}">${l}</button>`).join('')}</div>`;
  return `<div class="page page-wide"><div class="page-head"><div><h1 class="page-title">Memory</h1><p class="page-sub">Mistakes this project has made, and the standards each one is checked against. Stats keep it honest: what cries wolf expires.</p></div></div>${tabs}${S.mtab === 'mistakes' ? memMistakes() : S.mtab === 'standards' ? memStandards() : memMine()}</div>`;
}
function memMistakes() {
  const m = memById(S.mem.sel) && allMem().includes(memById(S.mem.sel)) ? memById(S.mem.sel) : allMem()[0]; const { hits, fp } = eff(m); const [s, c] = memStatus(m); const rate = hits ? Math.round(fp / hits * 100) : 0;
  const matched = ITEMS.filter(i => i.memory.includes(m.id) && inRange().includes(i));
  const mx = Math.max(1, ...m.weeks);
  return `<div class="mem"><div class="card"><div class="card-head"><div class="segmented" role="group" aria-label="Kind">${[['all', 'All'], ['standard', 'Standard'], ['learned', 'Learned here']].map(([k, l]) => `<button data-act="mkind" data-v="${k}" aria-pressed="${S.mem.kind === k}">${l}</button>`).join('')}</div><input id="memq" class="input right" style="min-width:140px" type="search" placeholder="Search" value="${e(S.mem.q)}" aria-label="Search mistakes"></div><div id="memlist">${memListHTML()}</div></div>
    <article class="card"><div class="detail-head"><div class="badges"><span class="mono dim">${m.id}</span><span class="badge ${c}">${s}</span><span class="badge ${m.kind === 'learned' ? 'badge-ai' : 'badge-accent'}">${m.kind === 'learned' ? 'Learned here' : 'Standard'}</span><span class="badge">${e(m.ref)}</span><span class="chip-lang">${e(m.langs)}</span></div><h3>${e(m.name)}</h3><p class="dim">${e(m.from)}</p></div>
    <div class="tabbody"><div class="facts"><div class="k">Detector</div><div>${e(m.det)}</div><div class="k">Seen</div><div>${hits} times, last ${e(m.last)}</div><div class="k">Dismissed as false alarms</div><div><span class="fpbar"><i><b style="width:${rate}%"></b></i>${fp} of ${hits} (${rate}%)</span></div><div class="k">Last 12 weeks</div><div><span class="spark" role="img" aria-label="Hits per week">${m.weeks.map(w => `<i style="height:${Math.max(2, w / mx * 26)}px"></i>`).join('')}</span></div></div>
      <div class="kv" style="grid-template-columns:1fr 1fr"><div class="h">Bad</div><div class="h">Good</div><div class="bad mono">${e(m.bad)}</div><div class="good mono">${e(m.good)}</div></div>
      ${s === 'Expiring' ? `<div class="callout">${ico.alert}<div>More than 30% of the alarms were dismissed. With no real hit for 60 days this entry switches itself off.</div></div>` : ''}
      ${matched.length ? `<div class="callout callout-ai">${ico.file}<div><b>Matched in the current case:</b> ${matched.map(i => `<a href="#/case?item=${i.id}">${e(i.title)}</a>`).join(' · ')}</div></div>` : '<p class="dim">Not matched in the current case.</p>'}</div></article></div>`;
}
ACT.mem = el => { S.mem.sel = el.dataset.id; sync(); render(); };
ACT.mkind = el => { S.mem.kind = el.dataset.v; render(); };
ACT.mtab = el => { S.mtab = el.dataset.v; sync(); render(); };
function memStandards() {
  const on = PACKS.filter(p => S.packs[p.id] ?? p.on); const auto = on.reduce((a, p) => a + p.auto, 0), rules = on.reduce((a, p) => a + p.rules, 0);
  return `<div class="card"><div class="card-head"><span class="card-title">Standards packs</span><span class="dim">${on.length} on · ${auto} of ${rules} rules can be checked by a machine; the rest become questions for a reviewer</span></div>
    ${PACKS.map(p => { const v = S.packs[p.id] ?? p.on; return `<div class="pack"><label class="check"><input type="checkbox" data-chg="pack" data-id="${p.id}" ${v ? 'checked' : ''} aria-label="${e(p.name)}"></label><div><b>${e(p.name)}</b> <span class="badge">${e(p.ver)}</span><br><span class="dim">${e(p.warn || p.note || '')}</span></div><div style="text-align:right"><span class="dim" style="font-size:var(--t-xs)">${p.auto} of ${p.rules} machine-checkable</span><span class="autobar"><b style="width:${p.auto / p.rules * 100}%"></b></span></div></div>`; }).join('')}</div>
    <p class="dim">Packs are plain files you can read and edit, so a new edition of a standard is a file update, not a release.</p>`;
}
ACT.pack = el => { S.packs[el.dataset.id] = el.checked; render(); };
function memMine() {
  return `<div class="card card-pad" style="display:flex;flex-direction:column;gap:12px"><div class="card-title">Learn from your own history</div><p class="dim" style="max-width:66ch">Every “fix:” commit is a mistake someone already paid for. Assay reads them, groups the ones that look alike, and suggests a detector for each. You decide what gets added.</p>
    <div><button class="btn btn-second" data-act="mine">${ico.search} ${S.mem.mined ? 'Read the history again' : 'Read the git history'}</button></div>
    ${S.mem.mined ? `<div class="callout">${ico.check}<div>Read 412 commits. <b>38</b> are fixes, in <b>9</b> groups. Three groups look worth a detector.</div></div><div class="card">${MINED.map(m => `<div class="pack" style="grid-template-columns:minmax(0,1fr) auto"><div><b>${e(m.name)}</b><br><span class="dim">${e(m.from)}</span></div>${S.mem.added[m.id] ? `<span class="badge badge-ok">${ico.check} Added</span>` : `<button class="btn btn-sm" data-act="addmined" data-id="${m.id}">Add detector</button>`}</div>`).join('')}</div>` : ''}</div>`;
}
ACT.mine = async el => { await morph(el, () => sleep(1600), { busy: 'Reading 412 commits…', done: 'Found 38 fixes', hold: 400 }); S.mem.mined = true; render(); };
ACT.addmined = async el => { const id = el.dataset.id; await morph(el, () => sleep(500), { busy: 'Adding…', done: 'Added', hold: 300 }); S.mem.added[id] = true; render(); };

/* ------------------------------------------------------------------ settings */
function pageSettings() {
  const sym = { b: 'In the first build', a: 'Small adapter', n: 'Not yet' }; const mark = { b: '✓', a: '◐', n: '–' };
  return `<div class="page"><div class="page-head"><div><h1 class="page-title">Settings</h1><p class="page-sub">What Assay uses, and what it costs.</p></div></div>
    <section class="section"><h2 class="section-title">Appearance</h2><div class="segmented" role="group" aria-label="Theme">${[['auto', 'Match the system'], ['light', 'Light'], ['dark', 'Dark']].map(([v, l]) => `<button data-act="theme" data-v="${v}" aria-pressed="${S.theme === v}">${l}</button>`).join('')}</div></section>
    <section class="section"><h2 class="section-title">Default budget</h2><div class="toolbar"><label for="b2" class="dim">Tokens the reviewers may spend per case</label><select id="b2" data-chg="budget">${[[0, 'Free only'], [20, '20k'], [40, '40k'], [80, '80k']].map(([v, l]) => `<option value="${v}" ${S.budget === v ? 'selected' : ''}>${l}</option>`).join('')}</select></div><p class="dim">The free checks never use tokens. The reviewers only look where the free checks say something changed.</p></section>
    <section class="section"><h2 class="section-title">Evidence providers</h2><p class="dim">Assay doesn’t rebuild what exists. It calls it, and keeps the results.</p><div class="card"><div class="table-wrap"><table class="table"><thead><tr><th>Provider</th><th>Gives</th><th>State</th></tr></thead><tbody>${PROVIDERS.map(p => `<tr><td><b>${e(p.name)}</b></td><td class="dim">${e(p.gives)}</td><td><span class="badge ${p.state === 'found' ? 'badge-ok' : ''}">${p.state === 'found' ? ico.check + ' Found' : 'Optional'}</span> <span class="dim">${e(p.how)}</span></td></tr>`).join('')}</tbody></table></div></div></section>
    <section class="section"><h2 class="section-title">Languages</h2><div class="card"><div class="table-wrap"><table class="lang"><thead><tr><th>Language</th>${LANG_COLS.map(c => `<th>${c}</th>`).join('')}</tr></thead><tbody>${LANGS.map(r => `<tr><td>${e(r[0])}</td>${r.slice(1).map(v => `<td class="${v}" title="${sym[v]}">${mark[v]}</td>`).join('')}</tr>`).join('')}</tbody></table></div></div>
      <div class="legend"><span><b style="color:var(--ok)">✓</b> in the first build</span><span><b style="color:var(--warn-ink)">◐</b> small adapter per language</span><span>– not yet</span></div>
      <p class="dim">Every language, even the last row, still gets the git diff, the project’s own test command (read as JUnit XML), black-box checks on its HTTP and its pages, and the secret scan.</p></section></div>`;
}
ACT.theme = el => { S.theme = el.dataset.v; const r = document.documentElement; if (S.theme === 'auto') r.removeAttribute('data-theme'); else r.setAttribute('data-theme', S.theme); try { localStorage.setItem('assay-theme', S.theme); } catch {} MX = null; render(); };

/* ------------------------------------------------------------------ palette (Ctrl K) */
let palSel = 0, palItems = [];
function palAll() {
  return [...PAGES.map(([id, l]) => ({ label: 'Go to ' + l, hint: 'page', run: () => go(id) })), { label: 'Go to Settings', hint: 'page', run: () => go('settings') },
    ...S.commits.map(c => ({ label: `Review ${c.h}: ${c.m}`, hint: 'commit', run: () => { S.mode = 'single'; S.from = S.to = c.h; S.sel = null; go('case'); } })),
    { label: 'Run the reviewers', hint: 'action', run: () => { go('reviewers'); runPanel(); } }, { label: 'Plant 12 bugs and test the reviewers', hint: 'action', run: () => { S.rtab = 'score'; go('reviewers', { tab: 'score' }); ACT.inject(); } }];
}
function palDraw() {
  const q = $('#palq').value.toLowerCase(); palItems = palAll().filter(x => x.label.toLowerCase().includes(q)).slice(0, 9); palSel = Math.min(palSel, Math.max(0, palItems.length - 1));
  $('#pallist').innerHTML = palItems.map((x, i) => `<li><button type="button" data-pi="${i}" aria-selected="${i === palSel}"><span>${e(x.label)}</span><span class="dim right">${x.hint}</span></button></li>`).join('') || '<li class="zero">Nothing matches.</li>';
}
function palOpen() { const d = $('#pal'); palSel = 0; $('#palq').value = ''; palDraw(); if (!d.open) d.showModal(); $('#palq').focus(); }
document.addEventListener('keydown', ev => { if ((ev.ctrlKey || ev.metaKey) && ev.key.toLowerCase() === 'k') { ev.preventDefault(); palOpen(); } });
function palRun() { const x = palItems[palSel]; if (x) { $('#pal').close(); x.run(); } }
ACT.palOpen = palOpen;

/* ------------------------------------------------------------------ boot */
function boot() {
  const g = [...'...xxxxx....|..x.....x...|.x.sss...x..|.xsssss..x..|.x.sss...x..|.x.......x..|..x.....xx..|...xxxxx.xx.|.........xxx|..........xx|............|............'.split('|')];
  let rects = ''; g.forEach((row, y) => [...row].forEach((c, x) => { if (c === 'x') rects += `<rect x="${x}" y="${y}" width="1" height="1" fill="var(--accent)"/>`; else if (c === 's') rects += `<rect x="${x}" y="${y}" width="1" height="1" fill="var(--marker)"/>`; }));
  $('#brand').innerHTML = `<svg class="brand-mark" viewBox="0 0 12 12" shape-rendering="crispEdges" aria-hidden="true">${rects}</svg><span class="brand-name">assay</span>`;
  try { const t = localStorage.getItem('assay-theme'); if (t && t !== 'auto') { S.theme = t; document.documentElement.setAttribute('data-theme', t); } } catch {}
  $('#palq').addEventListener('input', () => { palSel = 0; palDraw(); });
  $('#palq').addEventListener('keydown', ev => { if (ev.key === 'ArrowDown') { ev.preventDefault(); palSel = Math.min(palItems.length - 1, palSel + 1); palDraw(); } else if (ev.key === 'ArrowUp') { ev.preventDefault(); palSel = Math.max(0, palSel - 1); palDraw(); } else if (ev.key === 'Enter') { ev.preventDefault(); palRun(); } });
  $('#pallist').addEventListener('click', ev => { const b = ev.target.closest('[data-pi]'); if (b) { palSel = +b.dataset.pi; palRun(); } });
  window.addEventListener('hashchange', route);
  route();
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { MX = null; render(); });
}
boot();

    </script>
  </body>
</html>
