<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>Assay · demo</title>
    <style>
/*CSS*/
    </style>
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to content</a>
    <div class="app">
      <header class="sidebar">
        <div class="brand" id="brand"></div>
        <div class="project-switch">
          <span class="project-switch-label">Project</span>
          <select aria-label="Project">
            <option>shop-website</option>
            <option disabled>api-gateway (no sample data)</option>
            <option disabled>todo-app (no sample data)</option>
          </select>
        </div>
        <button class="palette-open" type="button" data-act="palOpen" aria-keyshortcuts="Control+K Meta+K">Jump to… <kbd>Ctrl K</kbd></button>
        <nav class="nav" id="nav" aria-label="Main"></nav>
        <div class="sidebar-foot">
          <div class="live-state" role="status"><span class="dot dot-pulse"></span> Live</div>
          <div class="live-state"><span class="badge badge-accent">Demo</span> sample data, nothing measured</div>
        </div>
      </header>
      <main class="main" id="main" tabindex="-1"></main>
    </div>
    <div class="visually-hidden" id="live" role="status" aria-live="polite"></div>
    <dialog id="pal" aria-label="Jump to">
      <div class="dialog-body">
        <input id="palq" class="input pal-input" placeholder="Jump to a page, a commit or an action" aria-label="Jump to" autocomplete="off" />
        <ul class="pal-list" id="pallist"></ul>
      </div>
    </dialog>
    <dialog id="brief" aria-labelledby="bt">
      <div class="dialog-body">
        <h2 class="dialog-title" id="bt">What the agent receives</h2>
        <textarea id="brieftext" class="brief" readonly aria-label="Fix brief"></textarea>
        <p class="dim" id="briefmeta"></p>
        <div class="dialog-actions">
          <button class="btn" data-act="closebrief">Close</button>
          <button class="btn btn-primary" data-act="copybrief">Copy</button>
        </div>
      </div>
    </dialog>
    <script>
/*JS*/
    </script>
  </body>
</html>
